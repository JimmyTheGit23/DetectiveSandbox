# 导演规则配置 - 场景调度验证
# 确保每个场景中的人物、时间、物件、角色认知四要素一致

# 场景规则定义
scene_rules:
  # 船舱场景
  cabin_scene:
    allowed_characters: [lu_zhao, zhou_de_gui, agui, lao_fan]
    forbidden_characters: [lingyao, li_zheng, zhou_shi, shen_qingyue]
    time_phase: night
    weather: rain
    location: ship_cabin
    description: "沉船前的船舱，只有四人同行"
    
  # 岸边救援场景
  shore_scene:
    allowed_characters: [lu_zhao, lingyao]
    forbidden_characters: [agui, lao_fan, zhou_shi, li_zheng]
    time_phase: night
    weather: rain
    location: riverbank
    description: "沉船后凌瑶救起陆昭"
    
  # 客栈场景
  inn_scene:
    allowed_characters: [lu_zhao, lingyao, innkeeper]
    time_phase: night_to_dawn
    location: ferry_inn
    description: "客栈休整"
    
  # 码头场景
  dock_scene:
    allowed_characters: [lu_zhao, lingyao, zhou_shi, agui, lao_fan, li_zheng, crowd]
    required_characters: [zhou_shi]  # 周氏必须在场（死者家属）
    time_phase: dawn
    location: ferry_dock
    description: "发现尸体后的码头对峙"
    
  # 客栈大厅对峙
  confrontation_scene:
    allowed_characters: [lu_zhao, lingyao, agui, lao_fan, zhou_shi, li_zheng]
    time_phase: day
    location: inn_main_hall
    description: "正式质询对峙"

# 人物身份定义
character_identities:
  lu_zhao:
    title: "巡按御史"
    social_status: official
    initial_state: traveling
    companion: lingyao
    
  lingyao:
    title: "金鳞镖局首席镖师"
    social_status: commoner
    initial_state: waiting_for_ferry
    role: companion
    
  zhou_de_gui:
    title: "布商"
    social_status: merchant
    initial_state: traveling
    relationship_to_victim: self
    
  agui:
    title: "周德茂的仆从"
    social_status: servant
    initial_state: traveling
    relationship_to_victim: servant
    secret: accomplice
    
  lao_fan:
    title: "船家"
    social_status: commoner
    initial_state: working
    relationship_to_victim: boatman
    secret: saboteur
    
  zhou_shi:
    title: "周德茂之妻"
    social_status: merchant_wife
    initial_state: waiting_at_dock
    relationship_to_victim: spouse
    
  li_zheng:
    title: "渡口里正"
    social_status: local_official
    initial_state: at_dock
    relationship_to_victim: none
    
  shen_qingyue:
    title: "药材商"
    social_status: merchant
    initial_state: at_dock
    relationship_to_victim: creditor
    secret: mastermind

# 物件规则
object_rules:
  iron_crowbar:
    initial_location: ship_cabin_wall
    description: "铁撬棍"
    obtainable_at: cabin_phase
    state_changes:
      - phase: cabin_phase
        location: wall
        state: hanging
      - phase: sinking
        location: lu_zhao_hand
        state: in_use
      - phase: post_sinking
        location: lost_or_kept
        state: unknown
        
  ship_hull_hole:
    location: ship_bottom
    description: "船底方形洞口"
    discoverable_at: sinking_phase
    evidence_id: evidence_hull_hole
    
  official_seal:
    initial_location: lu_zhao_luggage
    description: "官印"
    state_changes:
      - phase: cabin_phase
        location: luggage
        state: safe
      - phase: sinking
        location: ship_bottom
        state: lost
      - phase: chapter_end
        location: reeds_near_dock
        state: found
        
  float_bladder:
    location: agui_bundle
    description: "牛皮浮囊"
    discoverable_at: day2_search
    evidence_id: evidence_float_bladder
    secret: prepared_escape_tool

# 角色认知规则
character_knowledge:
  lu_zhao:
    cabin_phase:
      knows:
        - "我是御史，奉旨巡查"
        - "同船有三人：布商、仆从、船家"
        - "船在行驶中"
      doesnt_know:
        - "船会被凿沉"
        - "阿贵和老范的计划"
        - "沈清月的存在"
      emotion: calm_cautious
      
    sinking_phase:
      knows:
        - "船正在沉没"
        - "船底有方形洞口"
        - "洞口是凿出来的（如果观察了）"
      doesnt_know:
        - "谁凿的船"
        - "为什么凿船"
      emotion: panic_determined
      
    post_sinking:
      knows:
        - "船是被故意凿沉的"
        - "自己差点被杀"
        - "凌瑶救了自己"
      doesnt_know:
        - "谁是凶手"
        - "阿贵和老范的角色"
      emotion: exhausted_suspicious
      
    accused_phase:
      knows:
        - "自己被指控为凶手"
        - "阿贵在说谎（如果观察了细节）"
        - "有人在布局陷害自己"
      doesnt_know:
        - "真正的凶手是谁"
        - "完整的阴谋"
      emotion: angry_determined
      
  agui:
    all_phases:
      knows:
        - "船是老范凿的"
        - "自己参与了计划"
        - "周德茂会被杀"
        - "自己有浮囊可以逃生"
      pretends_to_know_nothing: true
      pretends_emotion: grief_panic
      actual_emotion: calculated
      
  lao_fan:
    all_phases:
      knows:
        - "自己凿了船"
        - "阿贵参与了计划"
        - "沈清月是幕后主使"
        - "自己有赌债"
      pretends_to_know_nothing: true
      pretends_emotion: grief_panic
      actual_emotion: nervous_guilty
      
  zhou_shi:
    dock_phase:
      knows:
        - "丈夫死了"
        - "阿贵说陆昭是凶手"
      doesnt_know:
        - "阿贵在说谎"
        - "真正的凶手是谁"
      emotion: grief_anger
      
  li_zheng:
    all_phases:
      knows:
        - "有人死了"
        - "需要处理这个案子"
      doesnt_know:
        - "真正的凶手是谁"
        - "案件的复杂性"
      emotion: bureaucratic_cautious

# 台词规则
dialogue_rules:
  - rule: character_cannot_mention_future_events
    description: "角色不能提及未来事件"
    severity: error
    
  - rule: character_cannot_know_what_they_shouldnt
    description: "角色不能知道他们不应该知道的信息"
    severity: error
    
  - rule: character_emotion_matches_situation
    description: "角色情感应该匹配当前情境"
    severity: warning
    
  - rule: character_speech_matches_social_status
    description: "角色说话方式应该匹配其社会地位"
    severity: warning
    
  - rule: liar_consistency
    description: "说谎者的谎言应该前后一致"
    severity: error
    
  - rule: information_gap_preservation
    description: "信息差应该被正确维护"
    severity: error
