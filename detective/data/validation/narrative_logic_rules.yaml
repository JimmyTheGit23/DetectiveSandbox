# 剧情逻辑验证规则

# Flag逻辑规则
flag_logic:
  # Flag定义
  flags:
    cabin_phase:
      - cabin_saw_crowbar  # 看到铁撬棍
      - cabin_agui_talked   # 与阿贵对话过
      - cabin_lao_fan_talked # 与老范对话过
      - cabin_zhou_talked   # 与周德茂对话过
      - cabin_explore_done  # 船舱探索完成
      - observed_hole       # 观察到船洞
      
    sinking_phase:
      - cabin_phase_done    # 船舱阶段完成
      
    investigation_phase:
      - accused_of_murder   # 被指控谋杀
      - hull_evidence_found # 船体证据找到
      - agui_confessed      # 阿贵招供
      - lao_fan_confessed   # 老范招供
      
  # Flag依赖关系
  flag_dependencies:
    cabin_explore_done:
      requires:
        - cabin_agui_talked
        - cabin_lao_fan_talked
        - cabin_zhou_talked
      description: "必须与三个NPC都对话过才能完成探索"
      
    hull_evidence_found:
      requires:
        - cabin_phase_done
      description: "必须在沉船后才能找到船体证据"
      
    agui_confessed:
      requires:
        - hull_evidence_found
      description: "必须有船体证据才能让阿贵招供"

# 对话流程规则
dialogue_flow:
  # 对话可达性
  reachability:
    - rule: all_nodes_reachable
      description: "所有节点必须从start节点可达"
      severity: error
      
    - rule: no_dead_ends
      description: "不能有无法继续的死胡同（除非是end节点）"
      severity: error
      
    - rule: all_branches_merge
      description: "所有分支最终应该汇合到主线"
      severity: warning
      
  # 对话逻辑
  logic:
    - rule: requires_before_goto
      description: "带requires的选项必须在条件满足时才能选择"
      severity: error
      
    - rule: set_flag_before_check
      description: "检查flag前必须先设置flag"
      severity: error
      
    - rule: evidence_before_confrontation
      description: "质询前必须获得相关证据"
      severity: error

# 事件触发规则
event_triggers:
  # 事件依赖
  dependencies:
    evt_cabin_sleep:
      requires:
        - cabin_explore_done
      description: "船舱探索完成后触发沉船事件"
      
    day2_dawn:
      requires:
        - evt_cabin_sleep_done
      description: "沉船事件后进入第二天"
      
    confrontation_wang:
      requires:
        - hull_evidence_found
      description: "有船体证据才能进行质询"
      
  # 事件顺序
  sequence:
    - prologue_start
    - cabin_explore
    - evt_cabin_sleep
    - shore_rescue
    - inn_warm
    - day2_dawn
    - dock_discovery
    - accusation
    - investigation
    - confrontation
    - resolution

# 证据链规则
evidence_chain:
  # 证据获取顺序
  acquisition_order:
    - evidence_hull_hole: [sinking_phase]
    - evidence_cabin_escape_time: [sinking_phase]
    - evidence_lingyao_identity: [shore_phase]
    - evidence_iron_crowbar_location: [cabin_phase]
    - evidence_float_bladder: [day2_search]
    - evidence_agui_dismissal: [day2_search]
    - evidence_lao_fan_debt: [day2_search]
    
  # 证据依赖
  dependencies:
    evidence_float_bladder:
      requires: []
      description: "浮囊可以在任意搜索时获得"
      
    evidence_agui_dismissal:
      requires: []
      description: "遣散字据可以在任意搜索时获得"
      
    evidence_lao_fan_debt:
      requires: []
      description: "赌债证据可以在任意搜索时获得"
      
  # 证据用于质询
  confrontation_requirements:
    confrontation_wang:
      required_evidence: [evidence_hull_hole]
      optional_evidence: [evidence_cabin_escape_time, evidence_iron_crowbar_location]
      
    confrontation_agui:
      required_evidence: [evidence_float_bladder]
      optional_evidence: [evidence_agui_dismissal]
      
    confrontation_lao_fan:
      required_evidence: [evidence_lao_fan_debt]
      optional_evidence: [evidence_hull_hole]

# 进度系统规则
progression_rules:
  # 阶段解锁
  phase_unlocks:
    phase_1_initial:
      locations: [ferry_dock]
      npcs: [li_zheng, zhou_shi]
      
    phase_2_investigation:
      locations: [ferry_dock, inn_main_hall, inn_lao_fan_room, inn_agui_room]
      npcs: [li_zheng, zhou_shi, lao_fan, agui]
      requires: accused_of_murder
      
    phase_3_confrontation:
      locations: [ferry_dock, inn_main_hall]
      npcs: [li_zheng, zhou_shi, lao_fan, agui, shen_qingyue]
      requires: hull_evidence_found
      
  # 搜索点解锁
  search_point_unlocks:
    dock_shipwreck:
      requires: []
      description: "码头沉船残骸可以直接搜索"
      
    dock_shop_receipt:
      requires: []
      description: "码头店铺收据可以直接搜索"
      
    inn_lao_fan_room:
      requires: phase_2_investigation
      description: "老范房间需要进入调查阶段"
      
    inn_agui_room:
      requires: phase_2_investigation
      description: "阿贵房间需要进入调查阶段"

# 质询系统规则
confrontation_rules:
  # 质询流程
  flow:
    - rule: evidence_required
      description: "质询必须携带相关证据"
      severity: error
      
    - rule: npc_state_updated
      description: "质询后NPC状态应该更新"
      severity: warning
      
    - rule: trust_bar_updated
      description: "质询结果应该影响信任条"
      severity: warning
      
  # 质询结果
  outcomes:
    success:
      set_flag: [npc_confessed]
      npc_state_change: confession
      
    failure:
      set_flag: [confrontation_failed]
      npc_state_change: defensive
      
    partial:
      set_flag: [npc_suspicious]
      npc_state_change: nervous
