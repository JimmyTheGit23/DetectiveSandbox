# 美术资源一致性检查规则

# 资源路径规范
path_patterns:
  # 背景图
  background:
    pattern: "res://assets/cn/scenes/[a-z][a-z0-9_]*\\.png"
    description: "背景图放在assets/cn/scenes/目录下"
    examples:
      - "res://assets/cn/scenes/prologue_ferry_dock.png"
      - "res://assets/cn/scenes/prologue_ship_cabin_lu_room.png"
      
  # 立绘
  portrait:
    pattern: "res://assets/cn/portraits/[a-z][a-z0-9_]*\\.png"
    description: "立绘放在assets/cn/portraits/目录下"
    examples:
      - "res://assets/cn/portraits/lu_zhao.png"
      - "res://assets/cn/portraits/agui_nervous.png"
      
  # CG图
  cg:
    pattern: "res://assets/cn/cg/[a-z][a-z0-9_]*\\.png"
    description: "CG图放在assets/cn/cg/目录下"
    
  # 音效
  sfx:
    pattern: "res://assets/audio/sfx/[a-z][a-z0-9_]*\\.wav"
    description: "音效放在assets/audio/sfx/目录下"
    
  # BGM
  bgm:
    pattern: "res://assets/audio/bgm/[a-z][a-z0-9_]*\\.ogg"
    description: "BGM放在assets/audio/bgm/目录下"

# 文件命名规范
naming_conventions:
  # 背景图命名
  background:
    pattern: "prologue_[location]_[detail]\\.png"
    description: "序章背景以prologue_开头"
    examples:
      - "prologue_ferry_dock.png"
      - "prologue_ship_cabin_lu_room.png"
      - "prologue_ferry_inn.png"
      
  # 立绘命名
  portrait:
    pattern: "[character]_[emotion]\\.png"
    description: "立绘格式为角色名_表情"
    examples:
      - "lu_zhao_serious.png"
      - "agui_nervous.png"
      - "lao_fan_evasive.png"
      
  # 特殊立绘
  portrait_special:
    patterns:
      - "[character]_[pose].png"  # 如 companion_lingyao_anxious.png
      - "prologue_[character].png"  # 如 prologue_lu_zhao.png

# 资源引用完整性
reference_integrity:
  # 检查项目
  checks:
    - name: background_exists
      description: "背景图文件必须存在"
      source_files: [prologue_nodes.csv, dialogue_nodes.csv]
      source_field: background
      target_type: file
      
    - name: portrait_exists
      description: "立绘文件必须存在"
      source_files: [prologue_nodes.csv, dialogue_nodes.csv, characters.csv]
      source_field: portrait
      target_type: file
      
    - name: sfx_exists
      description: "音效文件必须存在"
      source_files: [prologue_nodes.csv]
      source_field: fx.sfx
      target_type: file
      
    - name: bgm_exists
      description: "BGM文件必须存在"
      source_files: [prologue_nodes.csv, bgm_config.json]
      source_field: bgm
      target_type: file

# 资源尺寸规范
size_requirements:
  background:
    width: 1920
    height: 1080
    description: "背景图标准尺寸1920x1080"
    
  portrait:
    width: 848
    height: 1264
    description: "立绘标准尺寸848x1264"
    
  cg:
    width: 1920
    height: 1080
    description: "CG图标准尺寸1920x1080"

# 资源格式规范
format_requirements:
  images:
    formats: [png]
    color_space: sRGB
    transparency: true
    
  audio:
    sfx:
      formats: [wav]
      sample_rate: 44100
      channels: 2
      
    bgm:
      formats: [ogg]
      sample_rate: 44100
      channels: 2

# 孤立资源检查
orphan_resource_check:
  # 检查未被引用的资源
  enabled: true
  description: "检查是否有资源文件未被任何CSV/JSON引用"
  
  # 忽略的目录
  ignore_patterns:
    - "**/.*"
    - "**/_*"
    - "**/test_*"

# 缺失资源检查
missing_resource_check:
  # 检查引用的资源是否存在
  enabled: true
  description: "检查CSV/JSON中引用的资源文件是否存在"
  
  # 严格模式：所有引用都必须存在
  strict_mode: true
  
  # 允许的缺失
  allowed_missing:
    - "res://assets/cn/scenes/pure_black.png"  # 纯黑背景可能动态生成
    - "res://assets/cn/scenes/pure_white.png"  # 纯白背景可能动态生成

# 资源版本控制
version_control:
  # 资源变更检查
  check_changes: true
  description: "检查资源文件是否有未提交的变更"
  
  # 忽略的文件
  ignore_patterns:
    - "*.import"
    - ".godot/*"
